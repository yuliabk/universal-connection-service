name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
  # Temporary: the failure-reporting step below comments on the PR.
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ucs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ucs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UCS_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/ucs_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Pre-pull MCPB sandbox image
        run: docker pull python:3.12-slim
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee /tmp/pytest.log
      - name: Report test failure on the PR (temporary debug step)
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### CI failure output (temporary debug step)"
            echo ""
            echo '```'
            tail -c 50000 /tmp/pytest.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
