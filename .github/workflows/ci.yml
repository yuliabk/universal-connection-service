name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ucs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ucs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UCS_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/ucs_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Build distributable wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -c "import glob, sys; sys.path.insert(0, glob.glob('dist/*.whl')[0]); import universal_connection_service as u; from universal_connection_service.app import app; assert '.whl' in u.__file__; assert '/v1/control-plane/executions/notices' in app.openapi()['paths']"
      - name: Pre-pull MCPB sandbox image
        run: docker pull python:3.12-slim
      - run: python -m pytest -q
