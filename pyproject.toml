[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-connection-service"
version = "0.1.0"
description = "Provider-neutral connection service for agents and plugins"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic>=2.8,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/universal_connection_service"]
