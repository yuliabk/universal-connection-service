[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-connection-service"
version = "0.1.0"
description = "Provider-neutral connection service for agents and plugins"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic>=2.8,<3", "uvicorn>=0.30,<1", "cryptography>=45,<51"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
openapi = ["openapi-spec-validator>=0.9,<1", "schemathesis>=4.27,<5"]
postgres = ["psycopg[binary,pool]>=3.2,<4"]
packages = ["cryptography>=45,<51"]
dev = ["pytest>=9,<10", "mcp>=2,<3", "openapi-spec-validator>=0.9,<1", "schemathesis>=4.27,<5", "psycopg[binary,pool]>=3.2,<4", "cryptography>=45,<51"]

[project.scripts]
ucs-db = "universal_connection_service.postgres_store:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/universal_connection_service"]
